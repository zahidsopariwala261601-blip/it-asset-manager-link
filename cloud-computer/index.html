<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Cloud Computer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131d; color: #f2f5ff; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 80% 0%, #233743 0, transparent 60%); }
    main { width: min(480px, 85vw); padding: 34px 0; }
    p { color: #aab5ca; line-height: 1.5; }
    .tag { color: #86efd0; font-size: .78rem; font-weight: 700; letter-spacing: .14em; }
    h1 { font-size: clamp(2.5rem, 9vw, 4.5rem); line-height: 1; letter-spacing: -.065em; margin: 16px 0; }
    a { display: inline-block; margin-top: 12px; padding: 12px 18px; color: #112820; background: #86efd0; border-radius: 8px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="tag">PERSONAL CLOUD STORAGE</p>
    <h1>Cloud Computer</h1>
    <p>Private file storage for your browser and Codex.</p>
    <p id="status" role="status">Opening the workspace on your VPS…</p>
    <a id="open" href="./destination.html">Open workspace →</a>
  </main>
  <script>
    fetch('./destination.html', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('Workspace address unavailable');
        return response.text();
      })
      .then((html) => {
        const config = new DOMParser().parseFromString(html, 'text/html');
        const address = new URL(config.getElementById('destination').getAttribute('href'));
        if (address.protocol !== 'https:' || address.username || address.password ||
            !/^[a-z0-9-]+\.trycloudflare\.com$/.test(address.hostname)) throw new Error('Invalid workspace address');
        document.getElementById('open').href = address.href;
        location.replace(address.href);
      })
      .catch(() => {
        document.getElementById('status').textContent = 'The workspace address is temporarily unavailable.';
      });
  </script>
</body>
</html>
